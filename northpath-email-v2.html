<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorthPath Email</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f3f4f6;
  color: #111827;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.header {
  background: #fff;
  border-top: 6px solid #b91c1c;
  border-radius: 12px 12px 0 0;
  padding: 28px 22px;
  text-align: center;
  border-bottom: 1px solid #e5e7eb;
}

.logo-maple {
  font-size: 44px;
  line-height: 1;
  margin-bottom: 8px;
}

.logo-name {
  color: #b91c1c;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 1px;
}

.logo-subtitle {
  margin-top: 6px;
  color: #4b5563;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.4px;
}

.logo-country {
  margin-top: 6px;
  color: #6b7280;
  font-size: 12px;
}

.card {
  background: #fff;
  border-radius: 0 0 12px 12px;
  padding: 28px;
}

h1 {
  margin: 0 0 8px;
  text-align: center;
  font-size: 26px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 28px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.field {
  display: flex;
  flex-direction: column;
}

label {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 7px;
  color: #374151;
}

.required {
  color: #b91c1c;
}

input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  background: #fff;
  color: #111827;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #b91c1c;
  box-shadow: 0 0 0 3px rgba(185,28,28,.10);
}

.generate-btn,
.copy-btn {
  width: 100%;
  min-height: 50px;
  border: 0;
  border-radius: 7px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.generate-btn {
  margin-top: 24px;
  background: #b91c1c;
  color: #fff;
}

.generate-btn:disabled,
.copy-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 16px;
  padding: 13px 15px;
  border-radius: 7px;
  font-size: 14px;
  line-height: 1.5;
}

.status.success {
  display: block;
  background: #ecfdf5;
  color: #065f46;
  border: 1px solid #a7f3d0;
}

.status.error {
  display: block;
  background: #fef2f2;
  color: #991b1b;
  border: 1px solid #fecaca;
}

.status.pending {
  display: block;
  background: #fffbeb;
  color: #92400e;
  border: 1px solid #fde68a;
}

.acceptance-status {
  display: none;
  margin-top: 18px;
  padding: 18px;
  border-radius: 9px;
  text-align: center;
  font-weight: 700;
}

.acceptance-status.pending {
  display: block;
  background: #f9fafb;
  color: #6b7280;
  border: 1px solid #e5e7eb;
}

.acceptance-status.accepted {
  display: block;
  background: #ecfdf5;
  color: #047857;
  border: 1px solid #a7f3d0;
  font-size: 17px;
}

.acceptance-time {
  display: block;
  margin-top: 7px;
  font-size: 12px;
  font-weight: 400;
  color: #4b5563;
}

.output {
  margin-top: 30px;
}

.output-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 12px;
}

.preview {
  width: 100%;
  min-height: 300px;
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  overflow: hidden;
}

.preview-empty {
  padding: 35px 20px;
  text-align: center;
  color: #6b7280;
}

.copy-btn {
  margin-top: 14px;
  background: #111827;
  color: #fff;
}

textarea {
  width: 100%;
  min-height: 220px;
  margin-top: 14px;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #f9fafb;
  color: #374151;
  font-family: monospace;
  font-size: 12px;
  resize: vertical;
}

.hidden {
  display: none;
}

@media (max-width: 650px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 20px 15px;
  }

  .form-grid {
    grid-template-columns: 1fr;
    gap: 15px;
  }

  h1 {
    font-size: 23px;
  }

  .logo-name {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo-maple">🍁</div>
    <div class="logo-name">NorthPath</div>
    <div class="logo-subtitle">
      RECRUITMENT &amp; APPLICATION SUPPORT
    </div>
    <div class="logo-country">Canada</div>
  </div>

  <div class="card">

    <h1>NorthPath Email</h1>

    <div class="subtitle">
      Generate a formal Canadian employment confirmation email with a secure acceptance link.
    </div>

    <form id="emailForm">

      <div class="form-grid">

        <div class="field">
          <label for="applicantName">
            Applicant Name <span class="required">*</span>
          </label>
          <input
            id="applicantName"
            type="text"
            placeholder="e.g. Prince Solomon Dweh"
            required>
        </div>

        <div class="field">
          <label for="applicantEmail">
            Applicant Email <span class="required">*</span>
          </label>
          <input
            id="applicantEmail"
            type="email"
            placeholder="e.g. applicant@email.com"
            required>
        </div>

        <div class="field">
          <label for="applicationReference">
            Application Reference <span class="required">*</span>
          </label>
          <input
            id="applicationReference"
            type="text"
            placeholder="Application reference"
            required>
        </div>

        <div class="field">
          <label for="position">
            Position <span class="required">*</span>
          </label>
          <input
            id="position"
            type="text"
            placeholder="e.g. House Keeper"
            required>
        </div>

        <div class="field">
          <label for="employer">
            Employer <span class="required">*</span>
          </label>
          <input
            id="employer"
            type="text"
            placeholder="e.g. Qualicare Homecare"
            required>
        </div>

        <div class="field">
          <label for="location">
            Location <span class="required">*</span>
          </label>
          <input
            id="location"
            type="text"
            placeholder="e.g. Waterloo Region, Ontario"
            required>
        </div>

      </div>

      <button
        id="generateButton"
        class="generate-btn"
        type="submit">
        GENERATE ACCEPTANCE EMAIL
      </button>

    </form>

    <div id="status" class="status"></div>

    <div
      id="acceptanceStatus"
      class="acceptance-status">
      Waiting for applicant confirmation...
    </div>

    <div class="output">

      <div class="output-title">
        Generated Email
      </div>

      <div id="preview" class="preview">
        <div class="preview-empty">
          Your email preview will appear here.
        </div>
      </div>

      <button
        id="copyButton"
        class="copy-btn"
        type="button"
        disabled>
        COPY EMAIL HTML
      </button>

      <textarea
        id="emailHtml"
        class="hidden"
        readonly
        placeholder="Generated email HTML will appear here..."></textarea>

    </div>

  </div>
</div>


<script>

const SUPABASE_FUNCTION_URL =
  "https://amatjkwcnaxuwoduhgwm.supabase.co/functions/v1/northpath-accept";

const STATUS_FUNCTION_URL =
  "https://amatjkwcnaxuwoduhgwm.supabase.co/functions/v1/northpath-accept-status";


const form =
  document.getElementById("emailForm");

const generateButton =
  document.getElementById("generateButton");

const copyButton =
  document.getElementById("copyButton");

const status =
  document.getElementById("status");

const preview =
  document.getElementById("preview");

const emailHtml =
  document.getElementById("emailHtml");

const acceptanceStatus =
  document.getElementById("acceptanceStatus");


let acceptanceId = null;
let statusTimer = null;


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function setStatus(type, message) {

  status.className =
    "status " + type;

  status.textContent =
    message;

}


function formatAcceptedTime(value) {

  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleString(
    "en-CA",
    {
      dateStyle: "long",
      timeStyle: "short"
    }
  );

}


function showPendingStatus() {

  acceptanceStatus.className =
    "acceptance-status pending";

  acceptanceStatus.innerHTML =
    "WAITING FOR APPLICANT CONFIRMATION" +
    '<span class="acceptance-time">' +
    "The applicant has not yet confirmed." +
    "</span>";

}


function showAcceptedStatus(acceptedAt) {

  acceptanceStatus.className =
    "acceptance-status accepted";

  const time =
    formatAcceptedTime(acceptedAt);

  acceptanceStatus.innerHTML =
    "✓ ACCEPTED" +
    (
      time
        ? '<span class="acceptance-time">' +
          "Confirmation received: " +
          escapeHtml(time) +
          "</span>"
        : ""
    );

}


async function checkAcceptanceStatus() {

  if (!acceptanceId) {
    return;
  }

  try {

    const response =
      await fetch(
        STATUS_FUNCTION_URL +
        "?id=" +
        encodeURIComponent(
          acceptanceId
        ),
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    if (
      data.acceptance_status ===
      "ACCEPTED"
    ) {

      showAcceptedStatus(
        data.accepted_at
      );

      setStatus(
        "success",
        "✓ Applicant acceptance received and recorded."
      );

      if (statusTimer) {

        clearInterval(
          statusTimer
        );

        statusTimer = null;

      }

      return;
    }


    showPendingStatus();

  } catch (error) {

    console.error(
      "Status check error:",
      error
    );

  }

}


function startStatusChecking() {

  if (statusTimer) {

    clearInterval(
      statusTimer
    );

  }

  showPendingStatus();

  checkAcceptanceStatus();


  statusTimer =
    setInterval(
      checkAcceptanceStatus,
      5000
    );

}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const name =
      document
        .getElementById("applicantName")
        .value.trim();

    const applicantEmail =
      document
        .getElementById("applicantEmail")
        .value.trim();

    const reference =
      document
        .getElementById("applicationReference")
        .value.trim();

    const position =
      document
        .getElementById("position")
        .value.trim();

    const employer =
      document
        .getElementById("employer")
        .value.trim();

    const location =
      document
        .getElementById("location")
        .value.trim();


    if (
      !name ||
      !applicantEmail ||
      !reference ||
      !position ||
      !employer ||
      !location
    ) {

      setStatus(
        "error",
        "Please complete all required fields."
      );

      return;

    }


    if (!applicantEmail.includes("@")) {

      setStatus(
        "error",
        "Please enter a valid applicant email address."
      );

      return;

    }


    generateButton.disabled =
      true;

    generateButton.textContent =
      "GENERATING...";


    setStatus(
      "pending",
      "Creating secure acceptance request..."
    );


    try {

      const response =
        await fetch(
          SUPABASE_FUNCTION_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              applicant_name:
                name,

              applicant_email:
                applicantEmail,

              application_reference:
                reference,

              position:
                position,

              employer:
                employer,

              location:
                location

            })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.acceptance_url
      ) {

        throw new Error(
          data.error ||
          "Unable to create acceptance request."
        );

      }


      const acceptanceUrl =
        data.acceptance_url;


      acceptanceId =
        data.id || null;


      const html =
        createEmailHtml({

          name,
          reference,
          position,
          employer,
          location,
          acceptanceUrl

        });


      preview.innerHTML =
        html;

      emailHtml.value =
        html;

      emailHtml.classList.remove(
        "hidden"
      );

      copyButton.disabled =
        false;


      setStatus(
        "success",
        "✓ Secure acceptance email created successfully."
      );


      if (acceptanceId) {

        startStatusChecking();

      } else {

        showPendingStatus();

      }


    } catch (error) {

      console.error(error);

      setStatus(
        "error",
        "Error: " + error.message
      );

    }


    generateButton.disabled =
      false;

    generateButton.textContent =
      "GENERATE ACCEPTANCE EMAIL";

  }
);


function createEmailHtml(data) {

  return `

<table width="100%" cellpadding="0" cellspacing="0" border="0"
style="background:#f3f4f6;padding:30px 12px;font-family:Arial,Helvetica,sans-serif;">

<tr>
<td align="center">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
style="max-width:700px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">

<tr>
<td align="center"
style="padding:30px 25px 25px;background:#ffffff;border-top:6px solid #b91c1c;border-bottom:1px solid #e5e7eb;">

<div style="font-size:44px;line-height:1;margin-bottom:8px;">
🍁
</div>

<div style="font-size:30px;font-weight:700;color:#b91c1c;letter-spacing:1px;">
NorthPath
</div>

<div style="font-size:12px;font-weight:600;color:#4b5563;letter-spacing:1.5px;margin-top:6px;">
RECRUITMENT &amp; APPLICATION SUPPORT
</div>

<div style="font-size:12px;color:#6b7280;margin-top:7px;">
Canada
</div>

</td>
</tr>


<tr>
<td align="center"
style="padding:32px 25px 12px;">

<div style="font-size:25px;font-weight:700;color:#111827;">
Employment Opportunity
</div>

<div style="font-size:14px;color:#6b7280;margin-top:7px;">
Confirmation of Willingness to Proceed
</div>

</td>
</tr>


<tr>
<td style="padding:20px 35px 35px;color:#1f2937;">

<p style="font-size:16px;line-height:1.6;margin:0 0 22px;">
Dear <strong>${escapeHtml(data.name)}</strong>,
</p>


<p style="font-size:15px;line-height:1.75;margin:0 0 20px;">
This communication is being issued on behalf of the employer and delivered through
<strong>NorthPath Professional Recruitment &amp; Application Support</strong>.
</p>


<p style="font-size:15px;line-height:1.75;margin:0 0 20px;">
Regarding your application for the
<strong>${escapeHtml(data.position)}</strong>
position with
<strong>${escapeHtml(data.employer)}</strong>
in
<strong>${escapeHtml(data.location)}</strong>,
the employer has indicated its willingness to proceed to the next stage of consideration.
</p>


<table width="100%" cellpadding="0" cellspacing="0" border="0"
style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;margin:25px 0;">

<tr>
<td style="padding:20px;">

<div style="font-size:13px;font-weight:700;color:#b91c1c;margin-bottom:14px;">
OPPORTUNITY DETAILS
</div>

<div style="font-size:14px;line-height:1.9;color:#1f2937;">

<strong>Position:</strong>
${escapeHtml(data.position)}
<br>

<strong>Employer:</strong>
${escapeHtml(data.employer)}
<br>

<strong>Location:</strong>
${escapeHtml(data.location)}
<br>

<strong>Application Reference:</strong>
${escapeHtml(data.reference)}

</div>

</td>
</tr>

</table>


<div style="font-size:17px;font-weight:700;color:#111827;margin:28px 0 12px;">
Employer Support and Costs
</div>

<p style="font-size:15px;line-height:1.75;margin:0 0 18px;">
The employer has indicated that it will provide support for the applicable
sponsorship and work-authorisation process at
<strong>no sponsorship charge to you</strong>,
subject to applicable requirements and approvals.
</p>

<p style="font-size:15px;line-height:1.75;margin:0 0 20px;">
The employer will also contribute
<strong>40% of the eligible flight cost.</strong>
</p>


<div style="font-size:17px;font-weight:700;color:#111827;margin:28px 0 12px;">
Your Costs
</div>

<p style="font-size:15px;line-height:1.75;margin:0 0 20px;">
You will be responsible for the remaining
<strong>60% of the eligible flight cost</strong>,
together with any applicable personal, documentation, visa, biometrics,

by the employer.
</p>

<p style="font-size:15px;line-height:1.75;margin:0 0 25px;">
Please review these arrangements carefully before confirming your willingness
to proceed.
</p>


<table width="100%" cellpadding="0" cellspacing="0" border="0"
style="margin:30px 0;">

<tr>
<td align="center">

<a href="${data.acceptanceUrl}"
style="display:inline-block;background:#b91c1c;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:18px 28px;border-radius:7px;">

ACCEPT &amp; CONFIRM WILLINGNESS TO PROCEED

<tr>
<td align="center"
style="padding-top:12px;font-size:12px;color:#6b7280;">

</td>
</tr>

</table>


<div style="font-size:17px;font-weight:700;color:#111827;margin:28px 0 12px;">
Official Employment Offer Letter
</div>

<p style="font-size:15px;line-height:1.75;margin:0 0 22px;">

</p>


<table width="100%" cellpadding="0" cellspacing="0" border="0"

</div>

<div style="font-size:13px;line-height:1.65;color:#4b5563;">

</p>

</td>

</table>

`;

}


copyButton.addEventListener(
  "click",
  async function() {

    const html =
      emailHtml.value;

    if (!html) {
      return;
    }

    try {

      if (
        navigator.clipboard &&
        window.ClipboardItem
      ) {

        const htmlBlob =
          new Blob(
            [html],
            { type: "text/html" }
          );

        const textBlob =
          new Blob(
            [preview.innerText],
            { type: "text/plain" }
          );

        const item =
          new ClipboardItem({

            "text/html":
              htmlBlob,

            "text/plain":
              textBlob

          });

        await navigator.clipboard.write([
          item
        ]);

      } else {

        emailHtml.classList.remove(
          "hidden"
        );

        emailHtml.select();

        document.execCommand(
          "copy"
        );

      }

      setStatus(
        "success",
        "✓ Email HTML copied successfully."
      );

    } catch (error) {

      console.error(error);

      emailHtml.classList.remove(
        "hidden"
      );

      emailHtml.select();

      document.execCommand(
        "copy"
      );

      setStatus(
        "success",
        "✓ Email HTML copied."
      );

    }

  }
);

</script>

</body>
</html>
